# N32AI Model Party catalogue (n32ai-modelparty).
#
# One entry per model folder.  The category is the use-case folder it lives in;
# `file` and `spec` are relative to this file's directory.
#
# BOM fields (mirrored by NOTICE and the per-model LICENSE.md):
#   license          weight licence (SPDX expression or NOASSERTION)
